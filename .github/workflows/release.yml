name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    with:
      binary: send-email
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
  deb:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      DEB_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 package --config packaging/nfpm.yaml --packager deb --target dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
  apt:
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - uses: morph027/apt-repo-action@v3
        id: repository
        with:
          repo-name: send-email
          scan-dir: debs
          codename: stable
          architectures: amd64 arm64
          signing-key: ${{ secrets.APT_SIGNING_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ee7d7ca7d611ef8c2a07885e8362de0c
          command: pages deploy ${{ steps.repository.outputs.dir }} --project-name=send-email-apt --branch=main
