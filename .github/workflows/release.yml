name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    with:
      binary: send-email
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
  deb:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: packaging/build-deb.sh "${RELEASE_TAG}" dist-deb
      - run: gh release upload "${RELEASE_TAG}" dist-deb/*.deb
